<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Every Site You Use, One Page</title>

  <!-- This links our CSS file. The browser reads this and applies the styles
       inside style.css to everything in this HTML file. -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ============ HEADER ============ -->
  <!-- Everything here is STATIC content, written by hand, since it only
       appears once. The 32 links below, by contrast, get built by JavaScript
       because they repeat the same pattern over and over (see script.js). -->
  <header class="hero">
   <button class="badge" id="badge-trigger" type="button">Don't click me</button>

    <h1 class="headline"> 
      Every site for <span class="accent">EVERYTHING.</span>
    </h1>

    <p class="subtext">
      32 handpicked links across 8 categories — video, movies, games, music
      and more. Click an icon and go.
    </p>

    <!-- A search box. We'll wire this up in script.js to hide/show cards
         as you type. -->
    <div class="search-wrap">
      <input
        id="search-input"
        type="text"
        placeholder="Search a site or category…"
        autocomplete="off"
      />
    </div>

    <!-- Category filter pills. id="pill-row" is empty on purpose —
         JavaScript fills it in based on the data in script.js, so if you
         add a new category to the data, a pill appears here automatically. -->
    <div class="pill-row" id="pill-row"></div>
  </header>

  <!-- ============ MAIN CONTENT ============ -->
  <!-- This is also empty on purpose. script.js reads the LINKS data and
       builds every section + card and drops it in here. -->
  <main id="directory"></main>

  <footer class="footer">
    <p>Built by a real NIGGA.</p>
  </footer>

  <!-- The script tag goes at the END of the body. This matters: by the time
       the browser reaches this line, it has already read and built the
       <header> and <main id="directory"> above, so script.js can safely
       find and modify them. If we put this in <head> instead, the script
       would run before #directory even existed. -->
  <div class="video-overlay hidden" id="video-overlay">
    <button class="overlay-close" id="overlay-close" type="button" aria-label="Close">✕</button>
    <video id="prank-video" src="assets/prank.mp4" autoplay controls playsinline></video>
  </div>

  <script src="script.js"></script>
</body>
</html>
